name: Build runner image

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: arc-runner-set-styx

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max          
          tags: |
            ghcr.io/${{ github.repository_owner }}/actions-runner:26.04-t2
            ghcr.io/${{ github.repository_owner }}/actions-runner:26.04-t2${{ github.sha }}
